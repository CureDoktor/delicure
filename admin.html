<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deli Cure - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .order-card {
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 15px;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .order-items {
      margin-bottom: 15px;
    }
    .order-total {
      font-weight: bold;
      text-align: right;
    }
    .order-actions {
      margin-top: 15px;
      display: flex;
      justify-content: flex-end;
    }
    .empty-state {
      text-align: center;
      padding: 50px 0;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h1 class="mb-4">Deli Cure - Admin Panel</h1>
    
    <div class="row mb-4">
      <div class="col">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Upravljanje porudžbinama</h5>
            <p class="card-text">Pregledajte i upravljajte porudžbinama klijenata.</p>
            <button id="refreshOrders" class="btn btn-primary">Osvežite porudžbine</button>
            <button id="clearOrders" class="btn btn-danger ms-2">Obrišite sve porudžbine</button>
          </div>
        </div>
      </div>
    </div>
    
    <div id="ordersContainer">
      <!-- Orders will be loaded here -->
      <div class="empty-state">
        <p>Učitavanje porudžbina...</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const ordersContainer = document.getElementById('ordersContainer');
      const refreshButton = document.getElementById('refreshOrders');
      const clearButton = document.getElementById('clearOrders');
      
      // Load orders from localStorage
      function loadOrders() {
        try {
          const ordersJson = localStorage.getItem('delicure_orders');
          const orders = ordersJson ? JSON.parse(ordersJson) : [];
          
          if (orders.length === 0) {
            ordersContainer.innerHTML = `
              <div class="empty-state">
                <p>Nema porudžbina za prikaz.</p>
              </div>
            `;
            return;
          }
          
          // Sort orders by timestamp (newest first)
          orders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          
          // Generate HTML for each order
          let ordersHtml = '';
          
          orders.forEach(order => {
            const orderDate = new Date(order.timestamp);
            const formattedDate = orderDate.toLocaleString('sr-RS');
            
            let itemsHtml = '';
            
            if (order.items.mala1.quantity > 0) {
              itemsHtml += `<div>Mala kutija 1: ${order.items.mala1.quantity} kom. (${order.items.mala1.total.toLocaleString()} RSD)</div>`;
            }
            
            if (order.items.mala2.quantity > 0) {
              itemsHtml += `<div>Mala kutija 2: ${order.items.mala2.quantity} kom. (${order.items.mala2.total.toLocaleString()} RSD)</div>`;
            }
            
            if (order.items.srednja.quantity > 0) {
              itemsHtml += `<div>Srednja kutija: ${order.items.srednja.quantity} kom. (${order.items.srednja.total.toLocaleString()} RSD)</div>`;
            }
            
            if (order.items.velika.quantity > 0) {
              itemsHtml += `<div>Velika kutija: ${order.items.velika.quantity} kom. (${order.items.velika.total.toLocaleString()} RSD)</div>`;
            }
            
            ordersHtml += `
              <div class="order-card" data-order-id="${order.id}">
                <div class="order-header">
                  <div>
                    <h5>Porudžbina #${order.id.substring(0, 8)}</h5>
                    <small>Datum: ${formattedDate}</small>
                  </div>
                  <div>
                    <span class="badge bg-primary">Nova</span>
                    ${order.simulated ? '<span class="badge bg-warning ms-2">Simulacija emaila</span>' : ''}
                  </div>
                </div>
                
                <div class="row">
                  <div class="col-md-6">
                    <h6>Detalji kupca:</h6>
                    <p>
                      <strong>Ime:</strong> ${order.customer.ime} ${order.customer.prezime}<br>
                      <strong>Email:</strong> ${order.customer.email}<br>
                      <strong>Telefon:</strong> ${order.customer.telefon}<br>
                      <strong>Adresa:</strong> ${order.customer.adresa}
                    </p>
                  </div>
                  <div class="col-md-6">
                    <h6>Detalji dostave:</h6>
                    <p>
                      <strong>Datum i vreme dostave:</strong> ${order.delivery.datetime}
                    </p>
                  </div>
                </div>
                
                <div class="order-items">
                  <h6>Naručeni proizvodi:</h6>
                  ${itemsHtml}
                </div>
                
                <div class="order-total">
                  Ukupno za plaćanje: ${order.total.toLocaleString()} RSD
                </div>
                
                <div class="order-actions">
                  <button class="btn btn-sm btn-success mark-processed" data-order-id="${order.id}">Označi kao obrađeno</button>
                  <button class="btn btn-sm btn-danger delete-order ms-2" data-order-id="${order.id}">Obriši</button>
                </div>
              </div>
            `;
          });
          
          ordersContainer.innerHTML = ordersHtml;
          
          // Add event listeners to buttons
          document.querySelectorAll('.mark-processed').forEach(button => {
            button.addEventListener('click', function() {
              const orderId = this.getAttribute('data-order-id');
              markOrderAsProcessed(orderId);
            });
          });
          
          document.querySelectorAll('.delete-order').forEach(button => {
            button.addEventListener('click', function() {
              const orderId = this.getAttribute('data-order-id');
              deleteOrder(orderId);
            });
          });
          
        } catch (error) {
          console.error('Error loading orders:', error);
          ordersContainer.innerHTML = `
            <div class="alert alert-danger">
              Došlo je do greške prilikom učitavanja porudžbina: ${error.message}
            </div>
          `;
        }
      }
      
      // Mark order as processed
      function markOrderAsProcessed(orderId) {
        try {
          const ordersJson = localStorage.getItem('delicure_orders');
          const orders = JSON.parse(ordersJson);
          
          const orderIndex = orders.findIndex(order => order.id === orderId);
          
          if (orderIndex !== -1) {
            orders[orderIndex].processed = true;
            localStorage.setItem('delicure_orders', JSON.stringify(orders));
            loadOrders(); // Reload orders
          }
        } catch (error) {
          console.error('Error marking order as processed:', error);
          alert('Došlo je do greške prilikom označavanja porudžbine kao obrađene.');
        }
      }
      
      // Delete order
      function deleteOrder(orderId) {
        if (confirm('Da li ste sigurni da želite da obrišete ovu porudžbinu?')) {
          try {
            const ordersJson = localStorage.getItem('delicure_orders');
            const orders = JSON.parse(ordersJson);
            
            const filteredOrders = orders.filter(order => order.id !== orderId);
            localStorage.setItem('delicure_orders', JSON.stringify(filteredOrders));
            loadOrders(); // Reload orders
          } catch (error) {
            console.error('Error deleting order:', error);
            alert('Došlo je do greške prilikom brisanja porudžbine.');
          }
        }
      }
      
      // Clear all orders
      function clearAllOrders() {
        if (confirm('Da li ste sigurni da želite da obrišete sve porudžbine? Ova akcija se ne može poništiti.')) {
          localStorage.removeItem('delicure_orders');
          loadOrders();
        }
      }
      
      // Add event listeners
      refreshButton.addEventListener('click', loadOrders);
      clearButton.addEventListener('click', clearAllOrders);
      
      // Load orders on page load
      loadOrders();
    });
  </script>
</body>
</html>
